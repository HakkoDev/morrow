[package]
name = "morrow-mail"
version = "0.2.0"
description = "Morrow, a desktop IMAP/SMTP mail client built with Rust, Tauri, React, and shadcn/ui"
authors = ["Morrow Contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "morrow_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "4.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname", "pool"] }
mailparse = "0.16"
mime_guess = "2"
ammonia = "4"
base64 = "0.22"
infer = "0.22"
# OAuth2 PKCE, HTTPS token exchange, and system-browser authorization.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-opener = "2.5.5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
panic = "abort"
