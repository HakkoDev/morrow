name: Release Morrow (Windows + Linux)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morrow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check source and prepare release notes
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check tagged source
        run: |
          bun run deps:check
          bun run test:source
          bun run biome:check
          bun run typecheck
          node scripts/verify-versions.mjs
      - name: Validate tag and generate release notes
        id: version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo 'Release requires a version tag.'; exit 1; }
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo 'Tag must match package.json version.'; exit 1; }
          node scripts/generate-release-notes.mjs --output release-notes.md
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Check signing credentials
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY secret.'; exit 1; }
          test -n "$TAURI_SIGNING_PUBLIC_KEY" || { echo 'Missing TAURI_SIGNING_PUBLIC_KEY variable.'; exit 1; }
          node scripts/prepare-release.mjs
      - name: Create draft release (preserve notes on reruns)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo 'Release is already published. Refusing to overwrite live updater assets.'; exit 1;
            }
            echo "Draft for $TAG already exists; retaining its notes."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Morrow $TAG" --draft --notes-file release-notes.md
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    # Parallel platform builds are safe: only the final job uploads latest.json.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 AppImage + DEB
            platform: ubuntu-22.04
            bundles: appimage,deb
            cache_key: morrow-linux
          - label: Windows x64 NSIS
            platform: windows-latest
            bundles: nsis
            cache_key: morrow-windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libsecret-1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache_key }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Validate tagged native source before packaging
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Generate signed release configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          bun run deps:check
          node scripts/prepare-release.mjs
      - name: Build signed packages (one release compilation per platform)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles '${{ matrix.bundles }}' --config src-tauri/tauri.release.conf.json
      - name: Stage installer and its Tauri-generated signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
            cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig release-assets/
            cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          fi
          ls -lh release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: morrow-release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Publish installers and one signed updater manifest
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          pattern: morrow-release-*
          path: release-assets
          merge-multiple: true
      - name: Build and validate combined updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > release-notes.md
          node scripts/create-updater-manifest.mjs \
            release-assets "$GITHUB_REPOSITORY" "$TAG" release-notes.md release-assets/latest.json
          find release-assets -maxdepth 1 -type f -printf '%f\n' > release-assets.txt
          node scripts/verify-release-assets.mjs release-assets/latest.json release-assets.txt
          # Keep the GPLv3 text alongside distributed installer binaries.
          cp LICENSE release-assets/LICENSE
      - name: Upload installers and signatures before manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
            echo 'Release was published while builds were running. Refusing to overwrite it.'; exit 1;
          }
          gh release upload "$TAG" \
            release-assets/*.exe release-assets/*.exe.sig \
            release-assets/*.AppImage release-assets/*.AppImage.sig \
            release-assets/*.deb release-assets/LICENSE --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload latest.json last, and verify GitHub assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p release-verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir release-verify
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > release-verify/assets.txt
          node scripts/verify-release-assets.mjs release-verify/latest.json release-verify/assets.txt
          echo "Both platforms verified. Review and publish the draft GitHub Release."
