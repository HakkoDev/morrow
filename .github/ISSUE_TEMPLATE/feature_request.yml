name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the workflow or pain point rather than only proposing a control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional context or mockups
    validations:
      required: false
