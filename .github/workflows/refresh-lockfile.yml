name: Refresh dependency lockfiles (reviewable PR)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate Bun/Cargo locks and verify Linux compilation
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri and keyring build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev pkg-config libsecret-1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: morrow-linux-lock-refresh
      - name: Regenerate frontend lockfile and install UI primitives
        run: bun install
      - name: Format and lint frontend
        run: |
          bun run biome:fix
          bun run biome:check
      - name: Regenerate Rust lockfile on a real Rust runner
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Verify manifest direct deps and Tauri pins
        run: bun run deps:check
      - name: Compile frontend and validate source
        run: |
          bun run test:source
          bun run typecheck
          bun run build
      - name: Format Rust sources on a real Rust runner
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Verify native dependencies, source and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Save generated Cargo.lock even if compilation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: morrow-refreshed-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Open a reviewable lockfile PR only after checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
          SOURCE_BRANCH: chore/morrow-refresh-cargo-lock-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock src src-tauri/Cargo.lock src-tauri/src
          if git diff --cached --quiet; then
            echo 'Dependency locks are already current; no PR required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$SOURCE_BRANCH"
          git commit -m 'chore: refresh Bun/Cargo locks and formatting for v0.2.0'
          git push origin "HEAD:$SOURCE_BRANCH"
          gh pr create --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" \
            --title 'chore: refresh frontend and native locks for v0.2.0' \
            --body 'Generated by the manual lockfile refresh workflow. This PR includes the refreshed bun.lock, Cargo.lock and automatic Biome/rustfmt formatting. Frontend checks and Linux Cargo check/test passed. Windows and live provider checks still required before releasing.'
